          - type: 'null'
          title: Relevance Score
          description: Numeric relevance of this card to the query on a 1.0-5.0 scale (5.0 = exact match; higher is more relevant). Only populated for entitled accounts; null otherwise.
        nodes:
          anyOf:
          - items:
              $ref: '#/components/schemas/TakoCardNode'
            type: array
          - type: 'null'
          title: Nodes
          description: Graph nodes (entities and metrics) behind this card. The response includes them by default. Absent for web-only cards or when node resolution was not available. Use each id with /beta/graph/node/{id} for full detail (aliases, subtype), or pass ids in sources.data.node_ids to pin these nodes in future searches.
        metric_definitions:
          anyOf:
          - items:
              $ref: '#/components/schemas/MetricDefinition'
            type: array
          - type: 'null'
          title: Metric Definitions
          description: Definitions of the metrics this card displays (name + definition). Null when no displayed metric has a definition available.
        data_freshness:
          anyOf:
          - $ref: '#/components/schemas/DataFreshness'
          - type: 'null'
          description: 'Freshness dates for the card''s data: the coverage date (data_as_of) and the last refresh date (last_updated). Null when neither date is available.'
      type: object
      title: TakoCard
      description: 'A Tako knowledge card on the search and answer surfaces. It carries a

        `content` download descriptor.'
    DataFreshness:
      properties:
        data_as_of:
          anyOf:
          - type: string
          - type: 'null'
