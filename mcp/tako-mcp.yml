  live-data search to any MCP client. Tools below are the candidate surface derived from the OpenAPI operations;
  the hosted server is the authoritative tool list.
tools:
- name: tako_available_data
  description: 'Find what data Tako holds on an entity or a metric, and the canonical name it holds it
    under.


    Best for: coverage questions themselves, or a metric''s canonical name before a priced search. Put
    a company, person, or place in `q` to list the metrics tracked on it; put a metric in `q` to list
    the entities it covers. Add `metric` when you know the measure — you get the resolved pair and a ready-to-run
    `next_call`.


    Search on the canonical names it returns, not your own phrasing — `tako_search` matches the graph''s
    names, not yours. A name here means the graph tracks it, not that a card exists. If the follow-up
    search comes back empty, say Tako has no card for it rather than rephrasing the query. Hand a node
    id to `tako_graph_related` to see what else connects to it.'
- name: tako_contents
  description: 'Fetch the full content behind a url: a web page''s text, or an exportable Tako card''s
    data rows. Batch up to 10 urls in one call — each one is billed and fails on its own.


    Fetch only cards that `tako_search` marked `exportable: true`. Rows bill per 1,000 delivered, so set
    `max_rows` when the recent rows are enough. A website-traffic or SEO card also bills a per-unit data
    minimum that `max_rows` doesn''t bound. If a page is long, such as a filing or an annual report, set
    `query` to a question to get back only the passages that answer it.


    Best for: reading one source in full — a page you need to quote, or the rows behind a card you need
    to compute over.'
- name: tako_graph_related
  description: 'Explore what a graph node connects to — its metrics, the entities a metric covers, competitors,
    industry, index membership, and sources.


    Two modes. Pass `node_id` alone for the map: every relation group with its key, label, total, and
    its first 3 names. Pass `relation` to page one group, where each item comes back with the id that
    explores it. Read a key off the map rather than guessing — an unknown key returns an empty group,
    not an error.


    Best for: expanding a node you already resolved. Resolve a name to a node id with `tako_available_data`
    first. A metric listed here means the graph tracks it, not that a card exists — `tako_search` is the
    final check.'
- name: tako_search
  description: 'Search Tako''s data graph and the live web in one call: many results at once, as structured
    cards plus web results, with the top card rendered inline as a chart.


    It finds data; `tako_contents` fetches it. Each card carries a headline value, node ids, and a url
    — pass the url to `tako_contents` for rows (`exportable: true` cards) or a web result''s full page
    text. When `exportable` is false the rows are locked — read the headline value from the card''s `description`.
    Website-traffic and SEO cards bill a per-unit data minimum above the search price.


    Best for: breadth — fan out several narrow queries in parallel. Each query resolves one metric — for
    one entity, or a comparison set ("Apple revenue", "Nvidia vs AMD gross margin"); several metrics or
    topics in one query retrieve poorly. To learn what Tako covers, or a metric''s canonical name, run
    `tako_available_data` first, then search on the canonical name it returns.'
