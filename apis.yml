aid: tako
name: Tako
description: >-
  Tako is an AI answer-engine API for authoritative, source-grounded data. It
  serves live financial, macroeconomic, and company data as cited answers,
  structured knowledge cards (charts, tables, maps), and embeddable
  visualizations for agents and applications. Developers build with four core
  APIs — Search (fast structured knowledge cards with no LLM in the loop), Answer
  (a single written, cited response), Contents (the exact numbers behind a card,
  as CSV), and Agent (asynchronous deep research runs) — plus a Data Graph for
  discovering what data exists, and Thin-Viz for turning your own data into
  embeddable Tako cards. Tako pulls from authoritative government, academic,
  think-tank, and licensed providers (S&P Global, SimilarWeb, YouGov, NOAA) — not
  scraped web content. It publishes an OpenAPI 3.1 spec, an official hosted MCP
  server, Python and TypeScript SDKs, an installable Agent Skill, an llms.txt, a
  Machine Payments Protocol surface, and emphasizes zero data retention, SOC 2
  compliance, and guaranteed SLAs. Surfaced as a portfolio company of Ribbit
  Capital.
